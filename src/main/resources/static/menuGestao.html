<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu gestão</title>

    <link rel="stylesheet" href="css/ambos/variaveis-templates.css">
    <link rel="stylesheet" href="css/adm/geral/layout.css">
    <link rel="stylesheet" href="css/adm/especifico/menuGestao.css">

    <script src="js/ambos/geral.js" defer></script>
    <script src="js/adm/menuGestao.js" defer></script>
</head>
<body>
    <header class="cabecalho-menu-gestao">
            <img src="icon/iconCasa.png" class="icon-cabecalho" onclick="deslogarAdmin()">
    </header>

    <main class="conteudo">
        <div class="container-funcoes">
            <a class="funcao" href="gestaoProdutos.html">
                <div class="img-funcao">
                    <img src="icon/product.png" class="icon">
                </div>
                <div class="descricao-funcao">
                    <p class="texto-descricao-funcao-mobile">Produtos</p>
                    <p class="texto-descricao-funcao">Insira, edite ou exclua os produtos de sua loja</p>
                </div>
            </a>

            <a class="funcao" href="gestaoPedidos.html">
                <div class="img-funcao">
                    <img src="icon/pedido (1).png" class="icon">
                </div>
                <div class="descricao-funcao">
                    <p class="texto-descricao-funcao-mobile">Pedidos</p>
                    <p class="texto-descricao-funcao">Veja, aceite ou aceite os pedidos de seus clientes</p>
                </div>
            </a>

            <a class="funcao" href="gestaoUsuarios.html">
                <div class="img-funcao">
                    <img src="icon/user.png" class="icon">
                </div>
                <div class="descricao-funcao">
                    <p class="texto-descricao-funcao-mobile">Usuários</p>
                    <p class="texto-descricao-funcao">Promova ou remova admins do sistema</p>
                </div>
            </a>

        </div>
    </main>
</body>
</html>
