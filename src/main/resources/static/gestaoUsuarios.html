<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários</title>

    <link rel="stylesheet" href="css/ambos/messageBox.css">
    <link rel="stylesheet" href="css/adm/geral/layout.css">
    <link rel="stylesheet" href="css/ambos/variaveis-templates.css">

    <script src="https://code.jquery.com/jquery-3.6.1.min.js" defer></script>
    <script src="js/ambos/geral.js" defer></script>
    <script src="js/adm/gestaoUsuarios.js" defer></script>
</head>
<body>
<header class="cabecalho-menu-gestao">
    <a href="menuGestao.html">
        <img src="icon/direito-removebg-preview.png" class="icon-cabecalho">
    </a>
</header>

<main class="conteudo">
    <div style="padding: 20px">

        <!-- Barra de busca por e-mail -->
        <div style="display:flex; gap:10px; margin-bottom:20px">
            <input type="text" id="inputEmail"
                   placeholder="Buscar usuário por e-mail..."
                   style="flex:1; padding:10px; border:1px solid #ccc">
            <button onclick="buscarUsuario()" style="padding:10px 20px">Buscar</button>
        </div>

        <!-- Card do usuário encontrado -->
        <div id="cardUsuario" style="display:none; border:1px solid #ddd;
             padding:20px; margin-bottom:20px">
            <p><strong>Nome:</strong> <span id="nomeUsuario"></span></p>
            <p><strong>E-mail:</strong> <span id="emailUsuario"></span></p>
            <p><strong>Código:</strong> <span id="codigoUsuario"></span></p>
            <p><strong>Admin:</strong> <span id="adminUsuario"></span></p>

            <hr>
            <p>Informe a senha do sistema para alterar o acesso:</p>
            <input type="password" id="senhaSistema"
                   placeholder="Senha do sistema"
                   style="padding:8px; border:1px solid #ccc; margin-right:10px">
            <button id="btnPromover" onclick="alterarAdmin(true)">Tornar Admin</button>
            <button id="btnRemover" onclick="alterarAdmin(false)">Remover Admin</button>
        </div>

        <div id="msgErro" style="color:red; display:none"></div>
    </div>
</main>

<!-- Message Box padrão do projeto -->
<div class="esconderMessageBox" id="esconder">
    <div class="message-box" id="mensagem">
        <div class="texto-message-box" id="textoMensagem"></div>
        <footer class="footer-message-box" id="btnMensagem">
            <button class="btn-message-box" id="btnMessage" onclick="fecharMessageBox()">Ok</button>
        </footer>
    </div>
</div>
</body>
</html>
