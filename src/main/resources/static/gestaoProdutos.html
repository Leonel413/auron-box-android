<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Produtos</title>

    <link rel="stylesheet" href="css/ambos/messageBox.css">
    <link rel="stylesheet" href="css/adm/geral/layout.css">
    <link rel="stylesheet" href="css/ambos/variaveis-templates.css">
    <link rel="stylesheet" href="css/adm/especifico/gestaoProdutos.css">
    <link rel="stylesheet" href="css/adm/especifico/formularioProdutos.css">

    <script
            src="https://code.jquery.com/jquery-3.6.1.min.js"
            integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
            crossorigin="anonymous" defer>
    </script>
    <script src="js/ambos/geral.js" defer></script>
    <script src="js/adm/produtos.js" defer></script>
</head>
<body>
<header class="cabecalho-menu-gestao">
    <a href="menuGestao.html">
        <img src="icon/direito-removebg-preview.png" class="icon-cabecalho">
    </a>
</header>

<main class="conteudo">
    <div class="container-produtos" id="containerProdutos">
        <div class="tabela-produtos" id="tabelaProdutos">
            <header class="cabecalho-tabela-produtos">
                <button class="btn-novo" onclick="renderizarFormProdutos(1)">Novo</button>
                <div class="linha-pesquisar-produto">
                    <input type="text" class="input-pesquisar" id="pesquisarProduto">
                    <img src="icon/lupa.png" class="img-pesquisar" onclick="pesquisar()">
                </div>
            </header>

            <!-- Cabeçalho da tabela — atualizado -->
            <div class="linha-tabela-produtos">
                <div class="coluna-principal-1">
                    <p class="texto-tabela-produtos-principal">Nome</p>
                </div>
                <div class="coluna-principal-2">
                    <p class="texto-tabela-produtos-principal">Marca / Modelo</p>
                </div>
                <div class="coluna-principal-3">
                    <p class="texto-tabela-produtos-principal">Valor</p>
                </div>
                <div class="coluna-principal-4">
                    <p class="texto-tabela-produtos-principal">Quantidade</p>
                </div>
                <div class="coluna-principal-5">
                    <p class="texto-tabela-produtos-principal">Cor</p>  <!-- era Tamanho -->
                </div>
                <div class="coluna-principal-6">
                    <p class="texto-tabela-produtos-principal">Categoria</p>  <!-- era Tipo -->
                </div>
                <div class="coluna-principal-7">
                    <p class="texto-tabela-produtos-principal">Ações</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Formulário de cadastro — atualizado -->
<div class="container-cadastro-produto" id="containerCadastroProdutos">
    <img src="icon/esconder.png" class="icon-esconder" onclick="renderizarFormProdutos(2)">
    <form class="formCadastro" enctype="multipart/form-data">
        <header class="divisor-titulo">
            <h1 class="titulo-form-produtos">Produto</h1>
            <input type="text" class="input-esconder" id="imagemEsconder">
        </header>

        <div class="inputs-formulario">

            <div class="divisor-4">
                <label class="texto-form-produtos">ID</label>
                <input type="text" class="input-form-produtos" id="codigoProduto" readonly>
            </div>

            <div class="divisor-5">
                <label class="texto-form-produtos">Nome do produto</label>
                <input type="text" class="input-form-produtos" id="nomeProduto" placeholder="Ex: Galaxy S24 Ultra">
            </div>

            <div class="divisor-2">
                <label class="texto-form-produtos">Descrição</label>
                <textarea class="text-area-form-produtos" id="descricaoProduto" cols="30" rows="3"
                          placeholder="Descreva o produto brevemente..."></textarea>
            </div>

            <!-- Categoria — era Tipo com ligas de futebol -->
            <div class="divisor-3">
                <label class="texto-form-produtos">Categoria</label>
                <select class="input-form-produtos" id="categoriaProduto">
                    <option value="escolha">Escolha</option>
                    <option value="Smartphones">Smartphones</option>
                    <option value="Notebooks">Notebooks</option>
                    <option value="Monitores">Monitores</option>
                    <option value="Periféricos">Periféricos</option>
                    <option value="Games">Games</option>
                    <option value="Acessórios">Acessórios</option>
                </select>
            </div>

            <!-- Marca — novo -->
            <div class="divisor-3">
                <label class="texto-form-produtos">Marca</label>
                <select class="input-form-produtos" id="marcaProduto">
                    <option value="escolha">Escolha</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Apple">Apple</option>
                    <option value="Sony">Sony</option>
                    <option value="LG">LG</option>
                    <option value="Dell">Dell</option>
                    <option value="Lenovo">Lenovo</option>
                    <option value="Asus">Asus</option>
                    <option value="Xiaomi">Xiaomi</option>
                    <option value="Microsoft">Microsoft</option>
                    <option value="Logitech">Logitech</option>
                    <option value="Outra">Outra</option>
                </select>
            </div>

            <!-- Modelo — novo -->
            <div class="divisor-5">
                <label class="texto-form-produtos">Modelo</label>
                <input type="text" class="input-form-produtos" id="modeloProduto" placeholder="Ex: Galaxy S24, iPhone 16 Pro">
            </div>

            <!-- Cor — era Tamanho -->
            <div class="divisor-3">
                <label class="texto-form-produtos">Cor</label>
                <select class="input-form-produtos" id="corProduto">
                    <option value="Preto">Preto</option>
                    <option value="Branco">Branco</option>
                    <option value="Prata">Prata</option>
                    <option value="Azul">Azul</option>
                    <option value="Grafite">Grafite</option>
                    <option value="Dourado">Dourado</option>
                    <option value="Roxo">Roxo</option>
                    <option value="Verde">Verde</option>
                    <option value="Vermelho">Vermelho</option>
                </select>
            </div>

            <!-- Garantia — novo -->
            <div class="divisor-3">
                <label class="texto-form-produtos">Garantia</label>
                <select class="input-form-produtos" id="garantiaProduto">
                    <option value="3 meses">3 meses</option>
                    <option value="6 meses">6 meses</option>
                    <option value="12 meses" selected>12 meses</option>
                    <option value="18 meses">18 meses</option>
                    <option value="2 anos">2 anos</option>
                </select>
            </div>

            <!-- Especificações — novo -->
            <div class="divisor-2">
                <label class="texto-form-produtos">Especificações técnicas</label>
                <textarea class="text-area-form-produtos" id="especificacoesProduto" cols="30" rows="3"
                          placeholder="Ex: RAM: 8GB, Armazenamento: 256GB, Tela: 6.2&quot;"></textarea>
            </div>

            <div class="divisor-3">
                <label class="texto-form-produtos">Desconto (%)</label>
                <input type="number" class="input-form-produtos" id="promocaoProduto" min="0" max="100" placeholder="0">
            </div>

            <div class="divisor-3">
                <label class="texto-form-produtos">Qtd estoque</label>
                <input type="number" class="input-form-produtos" id="quantidadeProduto" placeholder="0">
            </div>

            <div class="divisor-3">
                <label class="texto-form-produtos">Valor (R$)</label>
                <input type="number" class="input-form-produtos" id="valorProduto" placeholder="0.00" step="0.01">
            </div>

            <div class="divisor-3">
                <label class="texto-form-produtos">Imagem</label>
                <button type="button" class="btn-img">
                    <label for="upload" class="imagem-texto">Escolha a imagem</label>
                </button>
                <input type="file" class="input-img" id="upload" accept="image/*">
            </div>

        </div>

        <div class="divisor-btn">
            <button class="btn-limpar" type="reset">Limpar</button>
            <button type="button" class="btn-cadastrar" onclick="salvar()">Salvar</button>
        </div>
    </form>
</div>

<!-- Message Box -->
<div class="esconderMessageBox" id="esconder">
    <div class="message-box" id="mensagem">
        <div class="texto-message-box" id="textoMensagem"></div>
        <footer class="footer-message-box" id="btnMensagem">
            <button class="btn-message-box" id="btnMessage" onclick="fecharMessageBox()">Ok</button>
        </footer>
    </div>
</div>

</body>
</html>
