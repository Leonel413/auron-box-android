<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auron Box</title>


  <link rel="stylesheet" href="css/ambos/variaveis-templates.css">
  <link rel="stylesheet" href="css/ambos/messageBox.css">
  <link rel="stylesheet" href="css/usuario/geral/layout.css">
  <link rel="stylesheet" href="css/usuario/geral/header-footer.css">
  <link rel="stylesheet" href="css/usuario/geral/formularios.css">
  <link rel="stylesheet" href="css/usuario/especifico/index.css">

  <script src="https://code.jquery.com/jquery-3.6.1.min.js"
          integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ="
          crossorigin="anonymous" defer></script>
  <script src="js/ambos/geral.js" defer></script>
  <script src="js/usuario/formularios.js" defer></script>
  <script src="js/usuario/carrinho.js" defer></script>
  <script src="js/usuario/validacoes.js" defer></script>
  <script src="js/usuario/index.js" defer></script>

</head>

<body>
<input type="checkbox" class="input-menu" id="abrirMenu">
<div class="sobreposicao-menu"></div>

<!-- ═══ SIDEBAR ═══ -->
<nav class="container-menu">
  <div class="menu-login">
    <p class="p-login-cadastro" name="sessao">
      <a onclick="renderizarFormulario('login')" class="a-login-cadastro">Entrar</a>
      &nbsp;ou&nbsp;
      <a onclick="renderizarFormulario('cadastro')" class="a-login-cadastro">Criar conta</a>
    </p>
    <p class="p-login-sair" name="sessao">
      <a class="a-login-cadastro" onclick="sair()">↩ Sair</a>
    </p>
  </div>

  <div class="menu-links">
    <a class="item-menu" href="index.html">
      <div class="img-menu"><img src="icon/iconCasa.png" class="icon-menu"></div>
      <div class="texto-menu">Home</div>
    </a>
    <a class="item-menu" onclick="abrirMeusDados()">
      <div class="img-menu"><img src="icon/user-dados.png" class="icon-menu"></div>
      <div class="texto-menu">Meus dados</div>
    </a>
    <a class="item-menu" onclick="abrirMeusPedidos()">
      <div class="img-menu"><img src="icon/pedido.png" class="icon-menu"></div>
      <div class="texto-menu">Meus pedidos</div>
    </a>
    <a class="item-menu" href="carrinho.html">
      <div class="img-menu"><img src="icon/carrinho-menu.png" class="icon-menu"></div>
      <div class="texto-menu">Carrinho</div>
    </a>
  </div>

  <div class="sidebar-version">
    <p>© 2026 Auron Box</p>
  </div>

  <div class="margem-sair">
    <label for="abrirMenu">
      <img src="icon/esconder.png" class="icon-fechar-menu">
    </label>
  </div>
</nav>

<!-- ═══ MAIN ═══ -->
<main class="container-conteudo">

  <!-- Header -->
  <header class="cabecalho">
    <nav class="nav-atalhos">
      <label for="abrirMenu" class="hamburger-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </label>
      <a href="index.html" class="nome-loja">Auron Box</a>
    </nav>

    <nav class="nav-pesquisa">
      <div class="linha">
        <!-- Atualizado: placeholder para eletrônicos -->
        <input type="text" class="input-pesquisar"
               placeholder="Buscar produtos, marcas, modelos"
               id="barraPesquisar"
               onkeypress="if(event.key==='Enter') buscar('busca/', $('#barraPesquisar').val())">
        <button class="btn-pesquisa" onclick="buscar('busca/', $('#barraPesquisar').val())" type="button">
          <img src="icon/lupa.png" class="icon-lupa">
        </button>
      </div>
    </nav>

    <div class="nav-atalhos">
      <a class="aCarrinho" href="carrinho.html">
        <img src="icon/carrinho-carrinho.png" width="28px">
        <p class="quantidade-carrinho" id="quantidade-carrinho">0</p>
      </a>
    </div>
  </header>

  <div class="container-sections">

    <h1 class="titulo-pagina">Eletrônicos</h1>

    <!-- Category chips — atualizados para eletrônicos -->
    <div class="category-chips">
      <button class="chip ativo" onclick="location.reload()">Todos</button>
      <button class="chip" onclick="buscar('categoria/','Smartphones')">Smartphones</button>
      <button class="chip" onclick="buscar('categoria/','Notebooks')">Notebooks</button>
      <button class="chip" onclick="buscar('categoria/','Monitores')">Monitores</button>
      <button class="chip" onclick="buscar('categoria/','Periféricos')">Periféricos</button>
      <button class="chip" onclick="buscar('categoria/','Games')">Games</button>
      <button class="chip" onclick="buscar('categoria/','Acessórios')">Acessórios</button>
    </div>

    <!-- Filtros — atualizados -->
    <header class="header-produto" id="titulo-pesquisa">
      <p class="texto-titulo-section" id="tituloSection">Todos os Produtos</p>
      <div class="filtros">
        <div class="linha-filtro">
          <img src="icon/sort.png" class="icon-filtrar">
          <!-- Atualizado: chama categoria/ em vez de tipo/ -->
          <select id="filtrar" class="escolha-ordenar" onchange="buscar('categoria/', this.value)">
            <option value="">Filtrar categoria</option>
            <option value="Smartphones">Smartphones</option>
            <option value="Notebooks">Notebooks</option>
            <option value="Monitores">Monitores</option>
            <option value="Periféricos">Periféricos</option>
            <option value="Games">Games</option>
            <option value="Acessórios">Acessórios</option>
          </select>
        </div>
        <div class="linha-filtro">
          <img src="icon/ordenar.png" class="icon-ordenar">
          <select id="ordenar" class="escolha-ordenar" onchange="buscar('', this.value)">
            <option value="">Ordenar</option>
            <option value="valorAsc">Menor preço</option>
            <option value="valorDesc">Maior preço</option>
          </select>
        </div>
      </div>
    </header>

    <section class="section-produto" id="section-produto"></section>
    <section class="section-produto" id="section-pesquisa"></section>

  </div>

  <!-- Footer — atualizado -->
</main>

<!-- ═══ MODAL Login / Cadastro ═══ -->
<div class="container-formulario" id="containerFormulario">
  <img src="icon/esconder.png" class="icon-esconder" onclick="fecharFormulario()">

  <!-- Cadastro -->
  <div class="form-cadastro" id="cadastro" name="formulario">
    <div class="cadastro-titulo">
      <h1 class="cadastro-titulo-texto">Criar Conta</h1>
      <button type="reset" class="btn-limpar"><img src="icon/lixo.png" width="16px"></button>
    </div>

    <!-- Step 1 -->
    <form class="step" id="step-1">
      <div class="divisor">
        <label class="label-form-cadastro">Nome completo</label>
        <input class="input-form-cadastro-1" type="text" id="nome" placeholder="Seu nome completo" name="input-step-1">
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Data de nascimento</label>
        <div class="margem-data-nascimento">
          <select class="input-form-cadastro-5" id="mesDataNascimento" onchange="gerarDias()">
            <option value="escolha">Mês</option>
            <option value="01">Jan</option><option value="02">Fev</option>
            <option value="03">Mar</option><option value="04">Abr</option>
            <option value="05">Maio</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Ago</option>
            <option value="09">Set</option><option value="10">Out</option>
            <option value="11">Nov</option><option value="12">Dez</option>
          </select>
          <select class="input-form-cadastro-5" id="diaDataNascimento"><option value="escolha">Dia</option></select>
          <select class="input-form-cadastro-5" id="anoDataNascimento"><option value="escolha">Ano</option></select>
        </div>
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">CPF</label>
        <input class="input-form-cadastro-2" type="text" maxlength="11" id="cpf" placeholder="Apenas dígitos" name="input-step-1">
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Email</label>
        <input class="input-form-cadastro-1" type="text" id="emailCadastro" placeholder="seu@email.com" name="input-step-1">
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Senha</label>
        <div class="linha-senha-cadastro">
          <input class="input-form-cadastro-senha" type="password" id="senhaCadastro" placeholder="Defina sua senha" name="input-step-1">
          <img src="icon/olho.png" class="icon-input" id="trocarInputCadastro">
        </div>
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Celular</label>
        <input class="input-form-cadastro-2" type="text" id="celular" placeholder="Apenas dígitos" maxlength="11">
      </div>
      <footer class="footer-form-cadastro">
        <button type="button" class="btn-cadastro" id="next">Avançar →</button>
      </footer>
    </form>

    <!-- Step 2 -->
    <form class="step" id="step-2">
      <div class="divisor">
        <label class="label-form-cadastro">CEP</label>
        <div class="linha-cep">
          <input class="input-form-cadastro-4" type="text" id="cep" maxlength="8" placeholder="Apenas dígitos" name="input-step-2">
          <button class="btn-cep" type="button" onclick="buscarEnderecoPorCEP()">Buscar</button>
        </div>
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Estado</label>
        <select id="estado" class="input-form-cadastro-3" name="input-step-2">
          <option value="escolha">Escolha</option>
          <option value="AC">Acre</option><option value="AL">Alagoas</option>
          <option value="AP">Amapá</option><option value="AM">Amazonas</option>
          <option value="BA">Bahia</option><option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option><option value="ES">Espírito Santo</option>
          <option value="GO">Goiás</option><option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option><option value="MS">Mato Grosso do Sul</option>
          <option value="MG">Minas Gerais</option><option value="PA">Pará</option>
          <option value="PB">Paraíba</option><option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option><option value="PI">Piauí</option>
          <option value="RJ">Rio de Janeiro</option><option value="RN">Rio Grande do Norte</option>
          <option value="RS">Rio Grande do Sul</option><option value="RO">Rondônia</option>
          <option value="RR">Roraima</option><option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option><option value="SE">Sergipe</option>
          <option value="TO">Tocantins</option>
        </select>
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Cidade</label>
        <input class="input-form-cadastro-2" type="text" id="cidade" placeholder="Nome da cidade" name="input-step-2">
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Bairro</label>
        <input class="input-form-cadastro-2" type="text" id="bairro" placeholder="Nome do bairro" name="input-step-2">
      </div>
      <div class="divisor">
        <label class="label-form-cadastro">Rua</label>
        <input class="input-form-cadastro-1" type="text" id="rua" placeholder="Nome da rua" name="input-step-2">
      </div>
      <div style="display:flex;gap:12px">
        <div class="divisor-1">
          <label class="label-form-cadastro">Número</label>
          <input class="input-form-cadastro-3" type="text" id="numero" placeholder="Nº" name="input-step-2" maxlength="6">
        </div>
        <div class="divisor-2">
          <label class="label-form-cadastro">Complemento</label>
          <input class="input-form-cadastro-2" type="text" id="complemento" placeholder="Ex: Casa B">
        </div>
      </div>
      <footer class="footer-form-cadastro">
        <button type="button" class="btn-voltar" id="back">← Voltar</button>
        <button type="button" class="btn-cadastro" onclick="cadastrarUsuario()">Criar conta</button>
      </footer>
    </form>
  </div>

  <!-- Login -->
  <form class="form-login" id="login" name="formulario">
    <div class="div-form-login">
      <div class="login-header">
        <span class="login-title">Bem-vindo</span>
        <span class="login-sub">Entre com sua conta para continuar</span>
      </div>
      <div class="linha-login">
        <input class="input-form-login" type="email" placeholder="seu@email.com" id="email" name="inputLogin">
        <img src="icon/user.png" class="icon-input">
      </div>
      <div class="linha-login">
        <input class="input-form-login" type="password" placeholder="Senha" id="senha" name="inputLogin">
        <img src="icon/olho.png" class="icon-input" id="trocarInputLogin">
      </div>
    </div>
    <footer class="footer-form-login">
      <button type="button" class="btn-login" id="btnLogin" onclick="fazerLogin()" disabled>Entrar</button>
    </footer>
  </form>

</div>

<!-- Message Box -->
<div class="esconderMessageBox" id="esconder">
  <div class="message-box" id="mensagem">
    <div class="texto-message-box" id="textoMensagem"></div>
    <footer class="footer-message-box" id="btnMensagem">
      <button class="btn-message-box" id="btnMessage" onclick="fecharMessageBox()">Ok</button>
    </footer>
  </div>
</div>

<script>
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('ativo'));
      chip.classList.add('ativo');
    });
  });
</script>
</body>
</html>
